<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskboard · Team board</title>
<style>
:root {
  --bg: #f5f6fa; --surface: #ffffff; --text: #161a23; --muted: #667085; --line: #e4e7ec;
  --accent-ink: #ffffff; --ok: #12b76a; --warn: #f79009; --bad: #f04438; --radius: 14px;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1116; --surface: #161b22; --text: #e6e8eb; --muted: #98a2b3; --line: #262c36;
          --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
       background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--surface) 85%, transparent);
       backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .in { max-width: 1080px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
.logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--accent-ink);
        background: linear-gradient(135deg, var(--accent), var(--accent-2)); font-weight: 700; }
.brand { font-weight: 700; letter-spacing: -.01em; font-size: 17px; }
.brand small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: 0; }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px;
        font-weight: 600; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.dot.bad { background: var(--bad); }
main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 48px; }
h1 { font-size: 26px; letter-spacing: -.02em; margin: 4px 0 4px; }
.sub { color: var(--muted); margin: 0 0 22px; }
.grid { display: grid; gap: 16px; }
.stats { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.stat { padding: 16px 18px; }
.stat .k { color: var(--muted); font-size: 13px; font-weight: 600; }
.stat .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; }
.panel { padding: 18px; }
.panel h2 { font-size: 15px; margin: 0 0 12px; }
form.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
input, select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
                border-radius: 10px; padding: 9px 12px; min-width: 0; }
input:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 9px 16px; cursor: pointer;
         background: var(--accent); color: var(--accent-ink); transition: transform .05s, filter .15s; }
button:hover { filter: brightness(1.07); } button:active { transform: translateY(1px); }
button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
button.icon { padding: 6px 10px; min-width: 34px; }
button:disabled { opacity: .5; cursor: not-allowed; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
     font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--line); }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
.tag.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.tag.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.empty { padding: 36px; text-align: center; color: var(--muted); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
.muted { color: var(--muted); }
#toast { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 8px; z-index: 20; }
.toast { background: var(--text); color: var(--bg); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow);
         font-weight: 600; font-size: 14px; animation: in .2s ease-out; }
.toast.bad { background: var(--bad); color: #fff; }
@keyframes in { from { transform: translateY(8px); opacity: 0; } }
footer { max-width: 1080px; margin: 0 auto; padding: 0 20px 28px; color: var(--muted); font-size: 12px; }

:root { --accent: #7c3aed; --accent-2: #db2777; }
.board { grid-template-columns: repeat(3, 1fr); align-items: start; }
@media (max-width: 820px) { .board { grid-template-columns: 1fr; } }
.col { padding: 14px; min-height: 260px; transition: outline-color .15s; outline: 2px dashed transparent; outline-offset: -6px; }
.col.over { outline-color: var(--accent); }
.col h2 { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 2px 4px 12px; }
.col h2 .n { margin-left: auto; color: var(--muted); font-weight: 600; }
.col h2 i { width: 10px; height: 10px; border-radius: 50%; }
.task { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; cursor: grab; }
.task:active { cursor: grabbing; } .task.dragging { opacity: .4; }
.task .t { font-weight: 600; margin-bottom: 8px; }
.task .meta { display: flex; align-items: center; gap: 6px; }
.task .meta .spacer { flex: 1; }
.task button { padding: 3px 8px; font-size: 12px; }
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 8px; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s; }
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="logo">TB</div>
  <div class="brand">Taskboard<small>Team board</small></div>
  <div class="spacer"></div>
  <span class="pill" id="health"><span class="dot"></span><span>checking…</span></span>
</div></header>
<main>
  <h1>Sprint board</h1>
  <p class="sub">Drag cards between columns. Web (Node) → API (Flask) → MySQL, all on one host behind one proxy.</p>
  <section class="grid stats">
    <div class="card stat"><div class="k">Open tasks</div><div class="v" id="s-open">–</div></div>
    <div class="card stat"><div class="k">High priority open</div><div class="v" id="s-high">–</div></div>
    <div class="card stat"><div class="k">Completed</div><div class="v" id="s-done">–</div><div class="progress"><i id="s-bar" style="width:0"></i></div></div>
  </section>
  <section class="card panel" style="margin-bottom:16px">
    <form class="row" id="add">
      <label style="flex:1">New task <input name="title" placeholder="What needs doing?" required maxlength="200" style="width:100%"></label>
      <label>Priority <select name="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label>
      <button>Add to To do</button>
    </form>
  </section>
  <section class="grid board" id="board"></section>
</main>
<footer>taskboard · Node web + Flask API + MySQL · deployed by devops-agent</footer>
<div id="toast"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLS = [["todo", "To do", "#94a3b8"], ["doing", "In progress", "#f59e0b"], ["done", "Done", "#12b76a"]];
const PRIO = { high: "bad", medium: "warn", low: "ok" };
function toast(msg, bad) { const t = document.createElement("div"); t.className = "toast" + (bad ? " bad" : ""); t.textContent = msg; $("#toast").append(t); setTimeout(() => t.remove(), 2600); }
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: { "Content-Type": "application/json" }, ...opts });
  if (!r.ok) { const b = await r.json().catch(() => ({})); throw new Error(b.error || r.statusText); }
  return r.status === 204 ? null : r.json();
}
async function health() {
  const ok = await fetch("/api/healthz").then((r) => r.ok).catch(() => false);
  $("#health").innerHTML = `<span class="dot ${ok ? "ok" : "bad"}"></span><span>${ok ? "API + MySQL online" : "API unreachable"}</span>`;
}
let tasks = [];
function render() {
  const done = tasks.filter((t) => t.status === "done").length;
  $("#s-open").textContent = tasks.length - done;
  $("#s-high").textContent = tasks.filter((t) => t.status !== "done" && t.priority === "high").length;
  $("#s-done").textContent = tasks.length ? `${done} / ${tasks.length}` : "–";
  $("#s-bar").style.width = tasks.length ? `${Math.round((done / tasks.length) * 100)}%` : "0";
  $("#board").innerHTML = COLS.map(([key, name, color], i) => {
    const mine = tasks.filter((t) => t.status === key);
    return `<div class="card col" data-col="${key}"><h2><i style="background:${color}"></i>${name}<span class="n">${mine.length}</span></h2>
      ${mine.map((t) => `<div class="task" draggable="true" data-id="${t.id}"><div class="t">${esc(t.title)}</div>
        <div class="meta"><span class="tag ${PRIO[t.priority]}">${t.priority}</span><span class="spacer"></span>
          ${i > 0 ? `<button class="ghost" data-move="${COLS[i - 1][0]}" title="Move back">←</button>` : ""}
          ${i < 2 ? `<button class="ghost" data-move="${COLS[i + 1][0]}" title="Move forward">→</button>` : ""}
          <button class="ghost" data-del title="Delete">✕</button></div></div>`).join("") || `<p class="muted" style="margin:4px">Nothing here.</p>`}
    </div>`;
  }).join("");
}
async function load() {
  try { tasks = await api("/api/tasks"); render(); }
  catch (e) { $("#board").innerHTML = `<div class="card empty">Could not load tasks: ${esc(e.message)}</div>`; }
}
async function move(id, status) {
  const t = tasks.find((x) => x.id === id); if (!t || t.status === status) return;
  const before = t.status; t.status = status; render();               // optimistic: the card moves at once
  try { await api(`/api/tasks/${id}`, { method: "PATCH", body: JSON.stringify({ status }) }); }
  catch (err) { t.status = before; render(); toast(err.message, true); }
}
$("#add").addEventListener("submit", async (e) => {
  e.preventDefault(); const f = new FormData(e.target);
  try { await api("/api/tasks", { method: "POST", body: JSON.stringify({ title: f.get("title"), priority: f.get("priority") }) });
        toast("Task added"); e.target.reset(); load(); }
  catch (err) { toast(err.message, true); }
});
$("#board").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  const id = Number(b.closest(".task").dataset.id);
  if (b.dataset.move) return move(id, b.dataset.move);
  try { await api(`/api/tasks/${id}`, { method: "DELETE" }); toast("Task deleted"); load(); } catch (err) { toast(err.message, true); }
});
$("#board").addEventListener("dragstart", (e) => { const t = e.target.closest(".task"); if (!t) return; t.classList.add("dragging"); e.dataTransfer.setData("text/plain", t.dataset.id); });
$("#board").addEventListener("dragend", (e) => e.target.closest(".task")?.classList.remove("dragging"));
$("#board").addEventListener("dragover", (e) => { const c = e.target.closest(".col"); if (!c) return; e.preventDefault(); document.querySelectorAll(".col.over").forEach((x) => x !== c && x.classList.remove("over")); c.classList.add("over"); });
$("#board").addEventListener("dragleave", (e) => { const c = e.target.closest(".col"); if (c && !c.contains(e.relatedTarget)) c.classList.remove("over"); });
$("#board").addEventListener("drop", (e) => { const c = e.target.closest(".col"); if (!c) return; e.preventDefault(); c.classList.remove("over"); move(Number(e.dataTransfer.getData("text/plain")), c.dataset.col); });
health(); load(); setInterval(health, 15000);
</script>
</body>
</html>
